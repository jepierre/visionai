services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visionai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${EXTERNAL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CUDA_DEVICE: ${CUDA_DEVICE:-cuda:0}
      HF_HOME: /models/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./images:/app/images:ro
      - ./output:/app/output
      - huggingface_cache:/models/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.10", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: visionai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  huggingface_cache:
